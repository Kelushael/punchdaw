<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeonForge Voice — Download</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a08;
      color: #f2ebd9;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .logo {
      font-size: 3rem;
      font-weight: 900;
      color: #00f7ff;
      text-shadow: 0 0 20px rgba(0,247,255,0.5);
      margin-bottom: 0.5rem;
    }
    .subtitle {
      font-size: 1.1rem;
      color: #888;
      margin-bottom: 3rem;
    }
    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: linear-gradient(135deg, #00f7ff, #0088ff);
      color: #000;
      font-size: 1.25rem;
      font-weight: 700;
      padding: 1rem 2.5rem;
      border-radius: 1rem;
      text-decoration: none;
      box-shadow: 0 0 40px rgba(0,247,255,0.3);
      transition: transform 0.2s, box-shadow 0.2s;
      margin-bottom: 1rem;
    }
    .download-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 60px rgba(0,247,255,0.5);
    }
    .steps {
      margin-top: 2rem;
      color: #666;
      font-size: 0.9rem;
      max-width: 400px;
    }
    .steps li {
      list-style: none;
      margin: 0.5rem 0;
      padding-left: 1.5rem;
      position: relative;
    }
    .steps li::before {
      content: "→";
      position: absolute;
      left: 0;
      color: #00f7ff;
    }
    .version {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="logo">NEONFORGE VOICE</div>
  <div class="subtitle">Zero-config vocal tracking. Click. Install. Record.</div>

  <a id="download-link" class="download-btn" href="#">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    Download for Mac
  </a>

  <ul class="steps">
    <li>Double-click the .pkg file</li>
    <li>Click Continue → Continue → Install</li>
    <li>Enter your Mac password when asked</li>
    <li>NeonForge Voice appears in your Applications folder</li>
  </ul>

  <div class="version">v2.0.0 — macOS 10.15+ (Intel & Apple Silicon)</div>

  <script>
    // Auto-detect latest release from GitHub
    const REPO = 'Kelushael/punchdaw';
    fetch(`https://api.github.com/repos/${REPO}/releases/latest`)
      .then(r => r.json())
      .then(release => {
        const assets = release.assets || [];
        const isArm = navigator.platform.includes('arm') || navigator.platform.includes('MacIntel') && navigator.userAgent.includes('Mac');
        // Try to find the best pkg
        let pkg = assets.find(a => a.name.includes('arm64') && a.name.endsWith('.pkg'))
               || assets.find(a => a.name.endsWith('.pkg') && !a.name.includes('arm64'))
               || assets.find(a => a.name.endsWith('.pkg'));
        if (pkg) {
          document.getElementById('download-link').href = pkg.browser_download_url;
        }
      })
      .catch(() => {
        // Fallback to raw URL if API fails
        document.getElementById('download-link').href = '#';
      });
  </script>
</body>
</html>
